<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>SNAGDExtremes</title>

        <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Gunman092911/SNAGDExtremes/main/scratchnapped-gd-glazers-icon-4096.png?v=2" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css?v=classic-layout-2" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/submissions.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }" :style="store.themeStyle">
                    <button class="theme-trigger" type="button" @click.prevent="store.toggleDark()" :aria-label="store.dark ? 'Switch to light mode' : 'Switch to dark mode'" :title="store.dark ? 'Switch to light mode' : 'Switch to dark mode'">
                        <svg v-if="store.dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                        <svg v-else viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
            <div class="logo">
                <h2>SNAGDE</h2>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/submit">
                    <span class="type-label-lg">Submit Record</span>
                </router-link>
                <router-link class="nav__tab" to="/admin">
                    <span class="type-label-lg">Admin</span>
                </router-link>
                <div class="nav__actions">
                    <a class="nav__icon" href="https://discord.gg/f6r4Qh9Xj" target="_blank" rel="noopener noreferrer"><img src="./assets/discord.svg" alt="Discord Logo" /></a>
                </div>
            </nav>
        </header>

        <router-view v-slot="{ Component }">
            <transition name="tab-fade" mode="out-in">
                <component
                    :is="Component"
                    :key="$route.path"
                    :class="{ dark: store.dark }"
                    :style="store.themeStyle"
                ></component>
            </transition>
        </router-view>
    </body>
</html>
