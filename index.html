<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>SNAGDExtremes</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="./list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/submissions.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }" :style="store.themeStyle">
                    <button class="theme-trigger" type="button" @click.prevent="store.openThemes()" aria-label="Open theme customizer" title="Customize theme">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1.2a2.3 2.3 0 0 0 1.7-3.8 1.6 1.6 0 0 1 1.2-2.7H18a3 3 0 0 0 3-3c0-4.7-4-8.5-9-8.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="10" cy="6.8" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/><circle cx="17.5" cy="11" r="1" fill="currentColor"/></svg>
                    </button>
            <div class="logo">
                <h2>SNAGDE</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <router-link class="nav__tab" to="/submit">
                    <span class="type-label-lg">Submit Record</span>
                </router-link>
                <router-link class="nav__tab" to="/admin">
                    <span class="type-label-lg">Admin</span>
                </router-link>
                <div class="nav__actions">
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="Toggle dark mode" />
                    </button>
                    <a class="nav__icon" href="#"><img src="./assets/discord.svg" alt="Discord Logo" /></a>
                </div>
            </nav>
        </header>

        <div v-if="store.themeOpen" class="theme-backdrop" @click.self="store.themeOpen = false">
            <section class="theme-panel" :style="store.themeStyle" role="dialog" aria-modal="true" aria-label="Theme customizer">
                <div class="theme-panel__heading">
                    <div><span class="theme-eyebrow">MAKE IT YOURS</span><h2>Theme Studio</h2><p>Pick a Geometry Dash inspired look or build your own.</p></div>
                    <button class="theme-close" @click="store.themeOpen = false" aria-label="Close">×</button>
                </div>
                <h3>Geometry Dash themes</h3>
                <div class="theme-presets">
                    <button v-for="(preset, key) in store.themes" :key="key" class="theme-preset" :class="{ selected: store.theme.name === preset.name }" @click="store.useTheme(key)">
                        <span class="theme-swatch" :style="{ background: preset.primary }"></span><span>{{ preset.name }}</span><span v-if="store.theme.name === preset.name" class="theme-check">✓</span>
                    </button>
                </div>
                <div class="theme-custom">
                    <h3>Create your own theme</h3>
                    <label class="theme-name-label">Theme name<input v-model="store.themeName" maxlength="24" placeholder="My awesome theme"></label>
                    <div class="theme-color-grid">
                        <label class="theme-color-field">Accent<input class="theme-color-input" type="color" v-model="store.themeDraft.primary" aria-label="Accent color"></label>
                        <label class="theme-color-field">Background<input class="theme-color-input" type="color" v-model="store.themeDraft.background" aria-label="Background color"></label>
                        <label class="theme-color-field">Panels<input class="theme-color-input" type="color" v-model="store.themeDraft.panel" aria-label="Panel color"></label>
                        <label class="theme-color-field">Text<input class="theme-color-input" type="color" v-model="store.themeDraft.text" aria-label="Text color"></label>
                        <label class="theme-color-field">Header<input class="theme-color-input" type="color" v-model="store.themeDraft.header" aria-label="Header color"></label>
                    </div>
                    <div class="theme-preview" :style="{ background: store.themeDraft.background, color: store.themeDraft.text, borderColor: store.themeDraft.primary }"><span :style="{ background: store.themeDraft.primary }"></span><strong>{{ store.themeName || 'Your theme' }}</strong><small>Live preview</small></div>
                    <button class="theme-save" @click="store.saveCustomTheme()">Save & apply custom theme</button>
                </div>
                <button class="theme-reset" @click="store.resetTheme()">Reset to SNAGD Classic</button>
            </section>
        </div>
        <router-view v-slot="{ Component }">
            <transition name="tab-fade" mode="out-in">
                <component
                    :is="Component"
                    :key="$route.path"
                    :class="{ dark: store.dark }"
                    :style="store.themeStyle"
                ></component>
            </transition>
        </router-view>
    </body>
</html>
