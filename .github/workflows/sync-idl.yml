name: Sync IDL placements

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-idl
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public deployment branch
        uses: actions/checkout@v4
        with:
          ref: preview/github-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch current IDL placements
        run: node scripts/sync-idl.mjs

      - name: Commit updated IDL snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idl-levels.json
          if git diff --cached --quiet; then
            echo "IDL placements have not changed."
          else
            git commit -m "Update IDL placements"
            git push
          fi
